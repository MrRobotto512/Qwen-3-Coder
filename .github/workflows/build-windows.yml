name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag of an existing release to build and attach files to (leave empty for a test build)
        required: false
  release:
    types: [published]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  # Unit tests plus a boot smoke test: launches the real app under a virtual display and fails
  # on any renderer error — a top-level throw in app.js (half-dead UI) can't ship again.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: xvfb-run -a npm run test:e2e
      - run: xvfb-run -a npm run test:e2e:agent

  build:
    needs: smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The release tag is the version the app reports and updates to. Any tag containing
      # X.Y.Z works: 0.3.0, v0.3.0, v.0.3.0, release-0.3.0.
      - name: Check the release tag against package.json
        if: env.RELEASE_TAG != ''
        shell: bash
        # The tag must point at the commit that carries the same version in package.json —
        # otherwise the release was tagged one commit behind and would ship the wrong code
        # under the new number.
        run: |
          VERSION=$(echo "$RELEASE_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          PKG=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "::error::Release tag '$RELEASE_TAG' has no version number in it. Use a tag like 0.3.0 or v0.3.0."
            exit 1
          fi
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Release tag $RELEASE_TAG says $VERSION but the tagged commit's package.json says $PKG — the tag points at the wrong commit. Delete this release and its tag, then publish again choosing 'create new tag on publish' so it lands on current main."
            exit 1
          fi
          echo "Building version $VERSION for release $RELEASE_TAG" 

      - name: Build installer, portable exe and zip
        run: npx electron-builder --win nsis portable zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List build output
        shell: bash
        run: ls -la dist dist/win-unpacked/resources

      - uses: actions/upload-artifact@v4
        with:
          name: qwen-workspace-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
            dist/*.blockmap

      - name: Attach builds to the release
        if: env.RELEASE_TAG != ''
        shell: bash
        # latest.yml and the .blockmap files are what the installed app's updater reads.
        run: gh release upload "$RELEASE_TAG" dist/*.exe dist/*.zip dist/latest.yml dist/*.blockmap --clobber
        env:
          GH_TOKEN: ${{ github.token }}
